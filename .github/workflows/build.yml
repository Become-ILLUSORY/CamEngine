name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Download Gradle & generate official wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          # 写入含真实 flutter.sdk 路径的 local.properties（settings.gradle 断言非空）
          echo "sdk.dir=/usr/lib/android-sdk" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          cd android
          ../gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --distribution-type bin
          rm -rf ../gradle-8.7 ../gradle-8.7-bin.zip

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camengine-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error