name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Download Gradle & generate official wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          # 在临时空目录执行 wrapper，只复制 jar+properties，避免 app 项目配置报错
          mkdir -p /tmp/gradle-wrap
          cd /tmp/gradle-wrap
          touch settings.gradle
          $OLDPWD/gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --distribution-type bin
          cp gradle/wrapper/gradle-wrapper.jar $OLDPWD/android/gradle/wrapper/
          cp gradle/wrapper/gradle-wrapper.properties $OLDPWD/android/gradle/wrapper/
          cd $OLDPWD
          rm -rf gradle-8.7 gradle-8.7-bin.zip /tmp/gradle-wrap

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camengine-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error