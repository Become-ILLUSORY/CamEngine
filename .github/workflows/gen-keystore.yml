name: Generate Signing Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate keystore
        run: |
          # 生成签名 keystore（密码固定，便于存入 secret 复用）
          keytool -genkeypair -v \
            -keystore camengine-release.keystore \
            -alias camengine \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass camengine-sign-2026 \
            -keypass camengine-sign-2026 \
            -dname "CN=CamEngine, OU=Dev, O=CamEngine, L=City, ST=State, C=CN"
          echo "=== keystore 信息 ==="
          keytool -list -keystore camengine-release.keystore \
            -storepass camengine-sign-2026 -alias camengine
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: camengine-release-keystore
          path: camengine-release.keystore
          if-no-files-found: error
